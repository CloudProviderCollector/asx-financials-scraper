services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: asx_financials
      POSTGRES_PASSWORD: asx_financials
      POSTGRES_DB: asx_financials
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asx_financials -d asx_financials"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
