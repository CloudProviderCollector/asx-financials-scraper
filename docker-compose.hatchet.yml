name: asx-hatchet
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: hatchet
      POSTGRES_PASSWORD: hatchet
      POSTGRES_DB: hatchet
    volumes:
      - hatchet-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hatchet -d hatchet"]
      interval: 10s
      timeout: 5s
      retries: 5
  worker:
    build:
      context: .
      dockerfile: Dockerfile.vea-crude-worker
    restart: unless-stopped
    profiles: ["worker"]
    env_file:
      - path: .env.local
        required: true
    environment:
      DATABASE_URL: "postgresql+psycopg://asx_financials:asx_financials@postgres:5432/asx_financials"
      HATCHET_CLIENT_HOST_PORT: hatchet:7077
      HATCHET_CLIENT_TLS_STRATEGY: none
      PYTHONIOENCODING: utf-8
    depends_on:
      hatchet:
        condition: service_started
    networks:
      - default
      - application
  hatchet:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-lite:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:7077:7077"
    environment:
      DATABASE_URL: "postgres://hatchet:hatchet@postgres:5432/hatchet?sslmode=disable"
      SERVER_AUTH_COOKIE_DOMAIN: localhost
      SERVER_AUTH_COOKIE_INSECURE: "t"
      SERVER_GRPC_BIND_ADDRESS: 0.0.0.0
      SERVER_GRPC_INSECURE: "t"
      SERVER_GRPC_BROADCAST_ADDRESS: localhost:7077
      SERVER_GRPC_PORT: "7077"
      SERVER_URL: http://localhost:8888
      SERVER_AUTH_SET_EMAIL_VERIFIED: "t"
      SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: localhost:7077
    volumes:
      - hatchet-config:/config
networks:
  application:
    external: true
    name: asx-financials-scraper_default
volumes:
  hatchet-postgres:
  hatchet-config:
